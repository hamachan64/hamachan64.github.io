<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>具現化ポーカー | Hamachan</title>
    <meta name="description" content="具現化ポーカー - Project 07">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 詳細ページ固有のスタイル */
        .detail-hero {
            height: 60vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(135deg, #1f1c2c, #928dab);
            background-size: cover;
            background-position: center;
            margin-top: 80px;
        }

        .detail-hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, var(--bg-color) 100%);
        }

        .detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .coming-soon-text {
            font-family: var(--font-heading);
            font-size: 3rem;
            color: var(--accent-color);
            margin: 100px 0;
            letter-spacing: 0.1em;
        }

        .back-link {
            display: inline-block;
            margin-top: 50px;
            color: var(--accent-color);
            font-family: var(--font-heading);
            border-bottom: 1px solid transparent;
        }

        .back-link:hover {
            border-bottom-color: var(--accent-color);
        }
    </style>
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <header class="header">
        <div class="logo">Yuki Hamaguchi</div>
        <nav class="nav">
            <ul>
                <li><a href="index.html#hero">TOP</a></li>
                <li><a href="index.html#about">ABOUT</a></li>
                <li><a href="index.html#works">WORKS</a></li>
                <li><a href="index.html#contact">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="detail-hero"></div>

        <div class="detail-container">
            <h1 style="font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 10px;">具現化ポーカー</h1>
            <p style="color: var(--accent-color); font-family: var(--font-heading); margin-bottom: 40px;">Immersive Card LBE</p>

            <div class="coming-soon-text">
                Coming soon...
            </div>

            <a href="index.html#works" class="back-link">← BACK TO WORKS</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 XR Creator Portfolio. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
