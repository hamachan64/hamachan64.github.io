<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスター召喚！ | Hamachan</title>
    <meta name="description" content="モンスター召喚！ - Project 05">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 詳細ページ固有のスタイル */
        .detail-hero {
            height: 60vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('assets/images/works/05/05-01.jpg'), linear-gradient(135deg, #1f1c2c, #928dab);
            background-size: cover;
            background-position: center;
            margin-top: 80px;
        }

        .detail-hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, var(--bg-color) 100%);
        }

        .detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
            position: relative;
            z-index: 2;
        }

        .project-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .meta-item strong {
            display: block;
            color: var(--accent-color);
            font-family: var(--font-heading);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .meta-item span {
            font-size: 0.9rem;
            color: #ccc;
        }

        .project-overview p {
            line-height: 2;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .project-media {
            margin: 40px 0;
        }

        /* YouTube Shorts Container */
        .youtube-shorts-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .youtube-shorts-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .media-item {
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #222;
            aspect-ratio: 16/9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 2;
        }

        @media screen and (min-width: 768px) {
            .youtube-shorts-container {
                max-width: 400px;
            }

            .image-gallery {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .image-gallery .media-item {
                margin-bottom: 0;
            }
        }

        .back-link {
            display: inline-block;
            margin-top: 50px;
            color: var(--accent-color);
            font-family: var(--font-heading);
            border-bottom: 1px solid transparent;
        }

        .back-link:hover {
            border-bottom-color: var(--accent-color);
        }
    </style>
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <header class="header">
        <div class="logo">Yuki Hamaguchi</div>
        <nav class="nav">
            <ul>
                <li><a href="index.html#hero">TOP</a></li>
                <li><a href="index.html#about">ABOUT</a></li>
                <li><a href="index.html#works">WORKS</a></li>
                <li><a href="index.html#contact">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="detail-hero"></div>

        <div class="detail-container">
            <h1 style="font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 10px;">モンスター召喚！</h1>
            <p style="color: var(--accent-color); font-family: var(--font-heading); margin-bottom: 40px;">AR / MR Experiment</p>

            <div class="project-meta">
                <div class="meta-item">
                    <strong>ROLE</strong>
                    <span>Creator</span>
                </div>
                <div class="meta-item">
                    <strong>TECH</strong>
                    <span>AR / Unity</span>
                </div>
                <div class="meta-item">
                    <strong>YEAR</strong>
                    <span>2026</span>
                </div>
            </div>

            <div class="project-overview">
                <h3 style="font-family: var(--font-heading); margin-bottom: 20px; color: var(--accent-color-2);">Overview</h3>
                <p>
                    現実世界にモンスターを召喚するXRの実験的プロジェクトです。<br>
                    空間を認識し、インタラクティブにキャラクターが出現する様子を表現しています。
                </p>
            </div>

            <div class="project-media">
                <div style="margin-bottom: 40px; text-align: center;">
                    <h3 style="font-family: var(--font-heading); margin-bottom: 15px;">Demo Video</h3>
                    <div class="youtube-shorts-container">
                        <iframe src="https://www.youtube.com/embed/9Kdja1OVgYo" title="YouTube video player"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen></iframe>
                    </div>
                </div>
                <!-- 画像ギャラリー -->
                <div class="image-gallery">
                    <div class="media-item">
                        <img src="assets/images/works/05/05-01.jpg" alt="モンスター召喚！ Image 1" onerror="this.style.display='none';">
                    </div>
                    <div class="media-item">
                        <img src="assets/images/works/05/05-02.jpg" alt="モンスター召喚！ Image 2" onerror="this.style.display='none';">
                    </div>
                    <div class="media-item">
                        <img src="assets/images/works/05/05-03.jpg" alt="モンスター召喚！ Image 3" onerror="this.style.display='none';">
                    </div>
                </div>
            </div>

            <a href="index.html#works" class="back-link">← BACK TO WORKS</a>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 XR Creator Portfolio. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
